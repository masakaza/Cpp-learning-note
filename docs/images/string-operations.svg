<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300"><rect width="900" height="300" fill="#fff"/><text x="450" y="38" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="27" font-weight="bold" fill="#263746">string：连续字符序列</text><g fill="#a9cbe8" stroke="#315d7c" stroke-width="2"><rect x="125" y="110" width="130" height="75"/><rect x="255" y="110" width="130" height="75"/><rect x="385" y="110" width="130" height="75"/><rect x="515" y="110" width="130" height="75"/><rect x="645" y="110" width="130" height="75"/></g><g font-family="Arial,sans-serif" font-size="27" fill="#18344b" text-anchor="middle"><text x="190" y="158">'h'</text><text x="320" y="158">'e'</text><text x="450" y="158">'l'</text><text x="580" y="158">'l'</text><text x="710" y="158">'o'</text></g><g font-family="Arial,'Microsoft YaHei',sans-serif" font-size="21" fill="#263746" text-anchor="middle"><text x="190" y="90">front()</text><text x="710" y="90">back()</text><text x="450" y="235">insert(pos)：指定位置插入　 erase(pos,count)：删除字符</text><text x="450" y="270">find() 查找子串　 substr() 截取子串　 += / append() 追加</text></g></svg>