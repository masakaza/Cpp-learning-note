<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330"><rect width="1000" height="330" fill="#fff"/><text x="500" y="35" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="27" font-weight="bold" fill="#263746">unordered_map：哈希函数映射到桶</text><g fill="#e9f1f8" stroke="#315d7c" stroke-width="2"><rect x="100" y="100" width="180" height="65"/><rect x="310" y="100" width="180" height="65"/><rect x="520" y="100" width="180" height="65"/><rect x="730" y="100" width="180" height="65"/></g><g font-family="Arial,'Microsoft YaHei',sans-serif" fill="#263746" font-size="21" text-anchor="middle"><text x="190" y="140">Bucket 0</text><text x="400" y="140">Bucket 1</text><text x="610" y="140">Bucket 2</text><text x="820" y="140">Bucket 3</text></g><g fill="#a9cbe8" stroke="#315d7c" stroke-width="2"><rect x="115" y="205" width="150" height="55" rx="5"/><rect x="325" y="205" width="150" height="55" rx="5"/><rect x="535" y="205" width="150" height="55" rx="5"/><rect x="745" y="205" width="150" height="55" rx="5"/></g><g font-family="Arial,'Microsoft YaHei',sans-serif" fill="#18344b" font-size="19" text-anchor="middle"><text x="190" y="239">key: "cat"</text><text x="400" y="239">key: "dog"</text><text x="610" y="239">key: "fox"</text><text x="820" y="239">冲突元素</text><text x="500" y="300" fill="#263746">hash(key) 计算桶位置；遍历顺序不保证按 key 排序</text></g></svg>