<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="330" viewBox="0 0 1100 330"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#3977a8"/></marker></defs><rect width="1100" height="330" fill="#fff"/><text x="550" y="35" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="27" font-weight="bold" fill="#263746">queue：先进先出（FIFO）</text><g fill="#a9cbe8" stroke="#315d7c" stroke-width="2"><rect x="210" y="120" width="150" height="78"/><rect x="360" y="120" width="150" height="78"/><rect x="510" y="120" width="150" height="78"/><rect x="660" y="120" width="150" height="78"/></g><g font-family="Arial,sans-serif" fill="#18344b" font-size="23" text-anchor="middle"><text x="285" y="168">10</text><text x="435" y="168">20</text><text x="585" y="168">30</text><text x="735" y="168">40</text></g><g stroke="#3977a8" stroke-width="4" fill="none" marker-end="url(#a)"><path d="M120 160H205"/><path d="M815 160H940"/></g><g font-family="Arial,'Microsoft YaHei',sans-serif" fill="#263746" font-size="22" text-anchor="middle"><text x="120" y="105">pop()</text><text x="940" y="105">push()</text><text x="285" y="230">front()</text><text x="735" y="230">back()</text><text x="550" y="285">从队首删除，从队尾添加；pop() 不返回被删除元素</text></g></svg>