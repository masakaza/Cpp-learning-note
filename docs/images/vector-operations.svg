<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="340" viewBox="0 0 1100 340"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#3977a8"/></marker></defs><rect width="1100" height="340" fill="#fff"/><g font-family="Arial,'Microsoft YaHei',sans-serif" fill="#263746" font-size="23"><text x="550" y="36" text-anchor="middle" font-size="27" font-weight="bold">vector：连续存储的动态数组</text><text x="110" y="111" text-anchor="middle">begin()</text><text x="1000" y="111" text-anchor="middle">end()</text><text x="550" y="293" text-anchor="middle">元素连续排列，可通过下标随机访问</text></g><g fill="#a9cbe8" stroke="#315d7c" stroke-width="2"><rect x="110" y="132" width="145" height="82"/><rect x="255" y="132" width="145" height="82"/><rect x="400" y="132" width="145" height="82"/><rect x="545" y="132" width="145" height="82"/><rect x="690" y="132" width="145" height="82"/><rect x="835" y="132" width="145" height="82"/></g><g font-family="Arial,sans-serif" font-size="22" fill="#18344b" text-anchor="middle"><text x="182" y="181">10</text><text x="327" y="181">20</text><text x="472" y="181">30</text><text x="617" y="181">40</text><text x="762" y="181">50</text><text x="907" y="181">空闲容量</text></g><g stroke="#3977a8" stroke-width="4" fill="none" marker-end="url(#a)"><path d="M182 72V122"/><path d="M907 72V122"/><path d="M550 270V224"/><path d="M327 270V224"/></g><g font-family="Arial,'Microsoft YaHei',sans-serif" font-size="21" fill="#263746" text-anchor="middle"><text x="182" y="65">front()</text><text x="907" y="65">back()</text><text x="550" y="266">push_back()：末尾添加</text><text x="327" y="266">pop_back()：删除末尾</text></g></svg>